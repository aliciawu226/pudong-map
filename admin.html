<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理地点 - 浦东地图</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <form class="login-card" id="loginForm">
      <div class="login-title">
        <div class="brand-mark">浦</div>
        <div>
          <h1>地图管理</h1>
          <p id="loginHint">输入管理密码</p>
        </div>
      </div>
      <input id="loginPassword" class="input" type="password" placeholder="管理密码" autocomplete="current-password">
      <button class="btn btn-primary btn-block" type="submit">进入管理</button>
      <p id="loginError" class="error-text"></p>
    </form>
  </div>

  <div id="editor" class="editor" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">浦</div>
        <div>
          <h1>管理地点</h1>
          <p>添加、修改你的地点和备注</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="syncStatus" class="sync-status"></span>
        <button id="bulkBtn" class="btn btn-ghost" type="button">批量添加</button>
        <button id="exportBtn" class="btn btn-ghost" type="button">导出备份</button>
        <button id="importBtn" class="btn btn-ghost" type="button">导入备份</button>
        <button id="sampleBtn" class="btn btn-ghost" type="button">删除示例</button>
        <a class="btn btn-primary" href="index.html">查看地图</a>
      </div>
      <input type="file" id="fileInput" accept=".json" hidden>
    </header>

    <main class="admin-main">
      <section class="form-panel">
        <h2 id="formTitle">新增地点</h2>
        <div class="field">
          <label class="field-label" for="nameInput">名称</label>
          <input id="nameInput" class="input" placeholder="例如：世纪公园">
        </div>
        <div class="field">
          <span class="field-label">类型</span>
          <div class="radio-row">
            <label><input type="radio" name="placeType" value="place" id="typePlace" checked> 个人地点</label>
            <label><input type="radio" name="placeType" value="work" id="typeWork"> 工作地点</label>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="categoryInput">分类</label>
          <input id="categoryInput" class="input" list="categoryList" placeholder="例如：美食">
          <datalist id="categoryList"></datalist>
        </div>
        <div class="field">
          <span class="field-label">颜色</span>
          <div id="colorSwatches" class="swatches"></div>
        </div>
        <div class="field">
          <label class="field-label" for="addressInput">地址</label>
          <div class="inline-row">
            <input id="addressInput" class="input" placeholder="例如：浦东新区世纪大道1号">
            <button id="geocodeBtn" class="btn btn-ghost btn-small" type="button">定位</button>
          </div>
          <div id="placeResults" class="place-results"></div>
        </div>
        <div class="field">
          <label class="field-label" for="noteInput">备注</label>
          <textarea id="noteInput" class="input" rows="3" placeholder="写点自己的备注"></textarea>
        </div>
        <div class="field">
          <span class="field-label">图片</span>
          <div id="photoPreviews" class="photo-previews"></div>
          <label class="btn btn-ghost btn-small" id="photoLabel">
            选择图片
            <input id="photoInput" type="file" accept="image/*" multiple hidden>
          </label>
          <p id="photoHint" class="photo-hint"></p>
        </div>
        <div class="coord-line">
          <span id="coordText">坐标：未设置</span>
          <button id="pickBtn" class="btn btn-ghost btn-small" type="button">在地图上点选</button>
        </div>
        <div class="form-actions">
          <button id="saveBtn" class="btn btn-primary" type="button">保存地点</button>
          <button id="cancelBtn" class="btn btn-ghost" type="button" hidden>取消</button>
        </div>
      </section>
      <section class="map-panel">
        <div id="adminMap"></div>
      </section>
    </main>

    <section class="list-panel">
      <div class="list-head">
        <h2>全部地点 <span id="countText"></span></h2>
        <input id="adminSearch" class="input" type="search" placeholder="搜索地点">
      </div>
      <div id="adminList" class="admin-list"></div>
    </section>
  </div>

  <div id="bulkModal" class="modal" hidden>
    <div class="modal-card">
      <h2>批量添加</h2>
      <p class="modal-hint">每行一个地点：名称,地址,备注</p>
      <textarea id="bulkText" class="input" rows="8" placeholder="陆家嘴,浦东新区世纪大道1号,和朋友约饭&#10;世纪公园,浦东新区锦绣路1001号,周末跑步"></textarea>
      <p id="bulkProgress" class="bulk-progress"></p>
      <div class="modal-actions">
        <button id="bulkCancel" class="btn btn-ghost" type="button">取消</button>
        <button id="bulkOk" class="btn btn-primary" type="button">开始添加</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
